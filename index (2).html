<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>see + do auckland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#111;--muted:#6d6d6d;--line:#e7e7e7;--paper:#fff;--soft:#f6f5f2;--local:#1d6b4d;--tourist:#315d9a;--family:#a35721}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.shell{max-width:1440px;margin:auto;padding:34px 42px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:30px;border-bottom:1px solid var(--line)}h1{font-family:Montserrat,sans-serif;font-size:clamp(2.4rem,6vw,5.3rem);line-height:.92;letter-spacing:-.07em;margin:0;font-weight:700}header p{max-width:500px;margin:0 0 4px;color:var(--muted);font-size:1rem}
.controls{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:18px;align-items:center;padding:30px 0 22px}.search{position:relative}.search input{width:100%;border:0;border-bottom:1px solid #222;border-radius:0;padding:13px 38px 13px 0;background:transparent;font:inherit;font-size:1rem;outline:none}.search span{position:absolute;right:4px;top:11px;font-size:20px}.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.filters button{border:1px solid #ccc;background:#fff;border-radius:999px;padding:9px 14px;font:600 .82rem "DM Sans";cursor:pointer}.filters button:hover,.filters button.active{background:#111;color:#fff;border-color:#111}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:30px}.map-wrap{position:sticky;top:16px;height:calc(100vh - 32px);min-height:570px}.map{height:100%;width:100%;background:#efefec}.map-note{position:absolute;z-index:500;left:14px;bottom:14px;background:rgba(255,255,255,.94);padding:10px 12px;font-size:.75rem;max-width:250px;box-shadow:0 3px 16px #0001}.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:.82rem}.cards{display:grid;gap:0}.card{padding:21px 0 22px;border-top:1px solid var(--line);cursor:pointer}.card:last-child{border-bottom:1px solid var(--line)}.card:hover h2{text-decoration:underline;text-underline-offset:4px}.meta{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card h2{font:600 clamp(1.25rem,2.2vw,1.65rem) Montserrat,sans-serif;letter-spacing:-.035em;margin:0}.area{color:var(--muted);font-size:.78rem;white-space:nowrap;margin-top:3px}.card p{margin:10px 0 13px;line-height:1.55;color:#454545}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:.68rem;letter-spacing:.02em;border-radius:999px;padding:5px 8px;background:var(--soft)}.tag.local{color:var(--local);background:#e8f2ed}.tag.tourist{color:var(--tourist);background:#e9eff7}.tag.family{color:var(--family);background:#f8eee5}.actions{display:flex;gap:16px;margin-top:15px}.actions a{font-size:.78rem;color:#111;font-weight:600;text-decoration:none;border-bottom:1px solid #111}.empty{padding:60px 0;color:var(--muted)}
.leaflet-popup-content-wrapper{border-radius:0;box-shadow:0 8px 36px #0003}.leaflet-popup-content{font-family:"DM Sans";margin:15px 17px}.popup-title{font:600 16px Montserrat;margin-bottom:5px}.popup-link{display:inline-block;margin-top:8px;color:#111;font-weight:600}.leaflet-control-zoom a{border-radius:0!important}.marker-dot{width:18px;height:18px;border:3px solid white;border-radius:50%;background:#111;box-shadow:0 1px 5px #0008}.marker-dot.local{background:var(--local)}.marker-dot.tourist{background:var(--tourist)}
@media(max-width:900px){.shell{padding:25px 20px 60px}header{display:block}header p{margin-top:20px}.controls{grid-template-columns:1fr}.filters{justify-content:flex-start}.layout{grid-template-columns:1fr}.map-wrap{position:relative;height:55vh;min-height:420px}.card h2{font-size:1.3rem}}
@media(max-width:480px){.shell{padding:22px 15px 45px}.filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.filters button{white-space:nowrap}.map-wrap{min-height:360px}.meta{display:block}.area{margin-top:7px}.card{padding:18px 0}}
</style>
</head>
<body><main class="shell">
<header><h1>see + do<br>auckland</h1><p>The well-known Auckland picks, plus the places I’d actually send friends. Beaches, neighbourhoods, walks, food stops and easy days out.</p></header>
<section class="controls"><label class="search"><input id="search" type="search" aria-label="Search places" placeholder="search places, areas or ideas"><span>⌕</span></label><div class="filters" aria-label="Filters"><button class="active" data-filter="all">all</button><button data-filter="local">andrew’s picks</button><button data-filter="tourist">tourist picks</button><button data-filter="family">family friendly</button><button data-filter="beach">beaches</button><button data-filter="food">food + drink</button></div></section>
<div class="layout"><div class="map-wrap"><div id="map" class="map" aria-label="Map of Auckland recommendations"></div><div class="map-note">West coast surf can be dangerous. Swim only at patrolled beaches and between the flags.</div></div><section><div class="list-head"><span id="count"></span><span>select a place to locate it</span></div><div id="cards" class="cards"></div></section></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places=[
{name:'Tāwharanui Regional Park',area:'Matakana Coast',cat:['local','family','beach'],lat:-36.3698,lng:174.8342,desc:'Skip the Waiheke day trip, get a car and drive north. Walk, swim and make a day of one of Auckland’s most beautiful coastal reserves.'},
{name:'Matakana village',area:'Matakana',cat:['local','family','food'],lat:-36.3527,lng:174.7164,desc:'Coffee, food, shops and the weekend market. Pair it with Tāwharanui, Omaha and Sawmill for a proper north-of-Auckland day.'},
{name:'Sawmill Brewery + Smoko Room',area:'Matakana',cat:['local','food'],lat:-36.32936,lng:174.73141,desc:'Locally brewed beer and a very good lunch stop just beyond Matakana.'},
{name:'Omaha Beach',area:'Omaha',cat:['local','family','beach'],lat:-36.3408,lng:174.7774,desc:'An easy, family-friendly beach addition to a Matakana or Tāwharanui day.'},
{name:'Waiheke Island',area:'Hauraki Gulf',cat:['tourist','beach','food'],lat:-36.7936,lng:175.0878,desc:'The classic ferry, vineyards and beaches day. It is good, but Andrew would hire a car and go north instead.'},
{name:'Birkenhead Point',area:'North Shore',cat:['local','family','food'],lat:-36.8185,lng:174.7308,desc:'Take the ferry here instead of Devonport, get a coffee and see a part of Auckland most visitors miss.'},
{name:'Devonport',area:'North Shore',cat:['tourist','family'],lat:-36.8317,lng:174.8011,desc:'A pretty ferry village with volcanic cones and harbour views. The classic visitor option.'},
{name:'Karangahape Road',area:'Central Auckland',cat:['local','food'],lat:-36.8577,lng:174.7602,desc:'Do not just wander the CBD. Take the CRL to K Road for independent shops, food, bars and more personality.'},
{name:'Grey Lynn Park',area:'Grey Lynn',cat:['local','family'],lat:-36.8614,lng:174.7297,desc:'A generous local park and playground, ideal with kids and surrounded by good neighbourhood food.'},
{name:'Takapuna Beach',area:'North Shore',cat:['local','tourist','family','beach'],lat:-36.7862,lng:174.7757,desc:'An easy urban beach with cafés nearby. Best around high tide.'},
{name:'Cheltenham Beach',area:'North Shore',cat:['local','family','beach'],lat:-36.8294,lng:174.8127,desc:'A calmer, quieter North Shore beach with Rangitoto sitting beautifully offshore.'},
{name:'Mission Bay',area:'Eastern Bays',cat:['tourist','family','beach','food'],lat:-36.8485,lng:174.8312,desc:'The familiar waterfront stop. Keep going a little further and spend your time at St Heliers instead.'},
{name:'St Heliers',area:'Eastern Bays',cat:['local','family','beach','food'],lat:-36.8507,lng:174.8581,desc:'Beach, cafés and a neighbourhood feel. Better with kids than Mission Bay, and a good destination by bike.'},
{name:'Tamaki Drive cycle',area:'Waterfront to St Heliers',cat:['local','family'],lat:-36.8491,lng:174.8176,desc:'Hire a bike and ride the flat waterfront route to St Heliers, roughly 10 km each way.'},
{name:'Auckland Art Gallery',area:'Central Auckland',cat:['local','tourist','family'],lat:-36.85128,lng:174.76636,desc:'A genuinely worthwhile city stop. Combine it with Albert Park and the university precinct.'},
{name:'Albert Park',area:'Central Auckland',cat:['local','family'],lat:-36.8521,lng:174.7685,desc:'Walk out behind the Art Gallery, find some grass and have a lie-down in the sun.'},
{name:'University of Auckland',area:'Central Auckland',cat:['local'],lat:-36.8523,lng:174.7698,desc:'Wander through the university precinct for historic and modern architecture, then continue towards K Road.'},
{name:'North Wharf + Wynyard Quarter',area:'Waterfront',cat:['local','tourist','family','food'],lat:-36.8406,lng:174.7577,desc:'Walk across from the city and keep going west beside the harbour. Food, boats, public space and plenty of people.'},
{name:'Ponsonby',area:'Inner West',cat:['local','food'],lat:-36.8555,lng:174.7469,desc:'Head uphill from the waterfront for shops, food and bars, then keep moving west into Grey Lynn.'},
{name:'Arataki Visitor Centre',area:'Waitākere Ranges',cat:['local','family'],lat:-36.9474,lng:174.6068,desc:'The adventurous option and a gateway to the Waitākere Ranges. Check current track closures before setting out.'},
{name:'Piha Beach',area:'West Auckland',cat:['tourist','beach'],lat:-36.9545,lng:174.4681,desc:'The famous black-sand beach with Lion Rock. Spectacular, but not the west coast’s only option.'},
{name:'Te Henga / Bethells Beach',area:'West Auckland',cat:['local','beach'],lat:-36.8894,lng:174.4499,desc:'Black sand, cliffs and dunes with a wilder, less crowded feel than Piha.'},
{name:'Karekare Beach',area:'West Auckland',cat:['local','beach'],lat:-36.9860,lng:174.4797,desc:'A quieter black-sand beach with Karekare Falls nearby. Limited parking adds to the sense of isolation.'},
{name:'Anawhata Beach',area:'West Auckland',cat:['local','beach'],lat:-36.9178,lng:174.4549,desc:'For people who genuinely want quiet. More effort to reach, which is exactly why it feels special.'},
{name:'Rangitoto Island',area:'Hauraki Gulf',cat:['tourist','family'],lat:-36.7866,lng:174.8605,desc:'Ferry over and walk through lava fields to the summit for a broad view across the gulf and city.'},
{name:'Auckland Museum + Domain',area:'Parnell',cat:['tourist','family'],lat:-36.8603,lng:174.7778,desc:'One standard visitor recommendation worth keeping: Māori and Pacific collections, architecture and a large park.'},
{name:'Maungawhau / Mount Eden',area:'Mount Eden',cat:['tourist','family'],lat:-36.8774,lng:174.7642,desc:'A free volcanic-cone walk and one of the clearest ways to understand Auckland’s geography.'}
];
const map=L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([-36.86,174.72],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers=new Map();let filter='all';
function mapUrl(p){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+', Auckland, New Zealand')}`}
function iconFor(p){let c=p.cat.includes('local')?'local':p.cat.includes('tourist')?'tourist':'';return L.divIcon({className:'',html:`<div class="marker-dot ${c}"></div>`,iconSize:[18,18],iconAnchor:[9,9]})}
places.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:iconFor(p)}).bindPopup(`<div class="popup-title">${p.name}</div><div>${p.desc}</div><a class="popup-link" target="_blank" rel="noopener" href="${mapUrl(p)}">open in Google Maps ↗</a>`);markers.set(p.name,m);m.addTo(map)});
function label(c){return c==='local'?"andrew’s pick":c==='tourist'?'tourist pick':c==='family'?'family friendly':c==='beach'?'beach':'food + drink'}
function render(){const q=document.querySelector('#search').value.toLowerCase().trim();const shown=places.filter(p=>(filter==='all'||p.cat.includes(filter))&&(!q||[p.name,p.area,p.desc,...p.cat].join(' ').toLowerCase().includes(q)));document.querySelector('#count').textContent=`${shown.length} place${shown.length===1?'':'s'}`;document.querySelector('#cards').innerHTML=shown.length?shown.map(p=>`<article class="card" data-name="${p.name}"><div class="meta"><h2>${p.name}</h2><span class="area">${p.area}</span></div><p>${p.desc}</p><div class="tags">${p.cat.map(c=>`<span class="tag ${c}">${label(c)}</span>`).join('')}</div><div class="actions"><a href="${mapUrl(p)}" target="_blank" rel="noopener">google maps ↗</a><a href="#map">show on map</a></div></article>`).join(''):'<div class="empty">No places match that search.</div>';markers.forEach((m,n)=>{if(shown.some(p=>p.name===n)){if(!map.hasLayer(m))m.addTo(map)}else if(map.hasLayer(m))map.removeLayer(m)});document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',e=>{if(e.target.tagName==='A'&&e.target.getAttribute('href')!=='#map')return;const p=places.find(x=>x.name===el.dataset.name);map.setView([p.lat,p.lng],13);markers.get(p.name).openPopup();if(innerWidth<901)document.querySelector('#map').scrollIntoView({behavior:'smooth'})}))}
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()}));document.querySelector('#search').addEventListener('input',render);render();setTimeout(()=>map.invalidateSize(),150);
</script></body></html>
